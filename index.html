<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
/* =====================================================================
   ✏️  YOUR SETTINGS: CHANGE ANYTHING IN THIS BLOCK
   ---------------------------------------------------------------------
   Only change the words between the "quote marks".
   Save the file, then refresh your browser to see the change.
   You never need to touch anything below this block.
   ===================================================================== */
var MY_PAGE = {

  // The big title at the top of the page
  title: "Bill's Animation Corner",

  // Your name, shown under the title
  name: "Bill",

  // A short line under your name
  tagline: "3D characters and stories made in iClone and Character Creator 5",

  // A short paragraph about your story, shown under the scene
  about: "Dr. Smoot is a scientist who builds an Earth of his very own, called MAIURTH, and escapes to it. He keeps it sealed inside a crystal, deep in a pit. In one scene, Dr. Smoot stands at the edge and peers down into the pit where the crystal-encased MAIURTH glows. I'm bringing the story to life in 3D, creating pieces in Blender and animating them in iClone and Character Creator 5.",

  // The caption under the moving scene at the top
  sceneCaption: "Dr. Smoot looks down into the pit where the crystal-encased MAIURTH is kept.",

  // The things on your page. Each one has a heading and a short note.
  // To add one, copy a whole { ... }, line, paste it below the last one, and change the words.
  // To remove one, delete its whole line.
  items: [
    { heading: "The MAIURTH Legend",          note: "The story of Dr. Smoot, who creates an Earth of his own and escapes to it." },
    { heading: "Dr. Smoot at the Pit",        note: "A scene I'm bringing to life: Dr. Smoot looking into the pit where the crystal-encased MAIURTH is kept." },
    { heading: "From Blender to iClone",      note: "How I move my work from Blender into iClone and Character Creator 5 to bring it to life." },
  ],

  // A spot for one of your pictures.
  //   true  = show the picture spot,   false = hide it
  showPicture: true,
  // Put a picture in the same folder as this file, then type its name here,
  // for example "dr-smoot.png". Leave it as "" to show an empty frame.
  pictureFile: "",
  pictureCaption: "A render from my latest scene",

  // A small "last updated" line at the bottom. It fills in the date by itself.
  //   true = show it,   false = hide it
  showLastUpdated: true,

  // Colors (warm and cozy). Each is a color code; you can search "color picker" online to find new ones.
  colorBackground: "#f6ecdc",   // the page background (warm cream)
  colorCards:      "#fffaf2",   // the boxes your items sit in
  colorText:       "#3b2a1e",   // the main writing (dark brown)
  colorAccent:     "#b5562b",   // headings and highlights (rust orange)
  colorGlow:       "#7fd3e6",   // the glow of the MAIURTH crystal (icy blue)
};
/* =================== END OF YOUR SETTINGS ============================ */
</script>

<title>Bill's Animation Corner</title>
<style>
  :root {
    --bg: #f6ecdc; --card: #fffaf2; --text: #3b2a1e; --accent: #b5562b; --glow: #7fd3e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 18px 48px; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { color: var(--accent); font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 4px; line-height: 1.15; }
  .name { font-size: 1.2rem; margin: 0; font-style: italic; }
  .tagline { margin: 6px 0 0; opacity: .85; }

  .scene { background: #241812; border-radius: 18px; overflow: hidden;
           box-shadow: 0 8px 24px rgba(59,42,30,.25); }
  .scene svg { display: block; width: 100%; height: auto; }
  .caption { text-align: center; font-style: italic; margin: 10px 8px 28px; opacity: .9; }

  .about { background: var(--card); border-radius: 14px; padding: 18px 22px; margin: 0 0 24px;
           font-size: 1.05rem; box-shadow: 0 3px 10px rgba(59,42,30,.12); }
  .items { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .card { background: var(--card); border-radius: 14px; padding: 18px 20px;
          border-top: 5px solid var(--accent); box-shadow: 0 3px 10px rgba(59,42,30,.12); }
  .card h2 { color: var(--accent); font-size: 1.2rem; margin: 0 0 6px; }
  .card p { margin: 0; }

  .picture { margin-top: 28px; text-align: center; }
  .frame { background: var(--card); border: 3px dashed var(--accent); border-radius: 14px;
           min-height: 220px; display: flex; align-items: center; justify-content: center;
           padding: 20px; overflow: hidden; }
  .frame.has-img { border-style: solid; padding: 0; }
  .frame img { width: 100%; height: auto; display: block; }
  .updated { text-align: center; margin-top: 36px; font-size: .9rem; opacity: .75; }

  /* --- animation --- */
  .spin { animation: spin 14s linear infinite; }
  @keyframes spin { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  .pulse { animation: pulse 3.5s ease-in-out infinite; transform-origin: 300px 250px; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .float { animation: float 5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .mote { animation: rise 6s linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-160px); opacity: 0; } }
  .lean { animation: lean 6s ease-in-out infinite; transform-origin: 140px 255px; }
  @keyframes lean { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .spin,.pulse,.float,.mote,.lean { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="name" id="name"></p>
    <p class="tagline" id="tagline"></p>
  </header>

  <!-- The moving scene: Dr. Smoot at the pit of MAIURTH -->
  <div class="scene">
    <svg viewBox="0 0 600 340" role="img" aria-label="Dr. Smoot looking down into a glowing pit where a crystal holds a tiny turning Earth">
      <defs>
        <radialGradient id="pitGlow" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="var(--glow)" stop-opacity=".9"/>
          <stop offset="100%" stop-color="var(--glow)" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a3d2b"/><stop offset="100%" stop-color="#2e1f16"/>
        </linearGradient>
        <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
          <stop offset="100%" stop-color="var(--glow)" stop-opacity=".25"/>
        </linearGradient>
        <clipPath id="globe"><circle cx="300" cy="200" r="26"/></clipPath>
      </defs>

      <!-- cave background -->
      <rect width="600" height="340" fill="#241812"/>
      <g fill="#f3d9a4" opacity=".6">
        <circle cx="60" cy="40" r="1.5"/><circle cx="520" cy="60" r="1.2"/><circle cx="450" cy="25" r="1"/>
        <circle cx="120" cy="90" r="1"/><circle cx="560" cy="120" r="1.5"/><circle cx="30" cy="150" r="1"/>
      </g>

      <!-- ground and the pit opening -->
      <path d="M0 250 Q150 235 300 240 T600 250 V340 H0 Z" fill="url(#rock)"/>
      <ellipse cx="300" cy="262" rx="170" ry="38" fill="#120b07"/>
      <ellipse class="pulse" cx="300" cy="250" rx="190" ry="120" fill="url(#pitGlow)"/>

      <!-- crystal holding MAIURTH, floating up out of the pit -->
      <g class="float">
        <polygon points="300,130 340,175 330,240 270,240 260,175" fill="url(#crystal)" stroke="var(--glow)" stroke-width="2"/>
        <polyline points="300,130 300,240" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" fill="none"/>
        <polyline points="260,175 300,190 340,175" stroke="#fff" stroke-opacity=".3" stroke-width="1.5" fill="none"/>
        <!-- the tiny turning Earth -->
        <circle cx="300" cy="200" r="26" fill="#2a6fb0"/>
        <g clip-path="url(#globe)">
          <g class="spin" fill="#5fae5a">
            <path d="M268 188 q10 -10 22 -2 q6 8 -4 14 q-12 4 -18 -12z"/>
            <path d="M298 205 q12 -6 18 4 q-2 12 -14 10 q-8 -4 -4 -14z"/>
            <path d="M318 182 q8 -4 12 4 q-4 6 -12 -4z"/>
            <path d="M468 188 q10 -10 22 -2 q6 8 -4 14 q-12 4 -18 -12z"/>
            <path d="M498 205 q12 -6 18 4 q-2 12 -14 10 q-8 -4 -4 -14z"/>
            <path d="M518 182 q8 -4 12 4 q-4 6 -12 -4z"/>
            <path d="M268 188 q10 -10 22 -2 q6 8 -4 14 q-12 4 -18 -12z" transform="translate(-200 0)"/>
          </g>
        </g>
        <circle cx="300" cy="200" r="26" fill="none" stroke="#fff" stroke-opacity=".4"/>
      </g>

      <!-- glowing specks rising from the pit -->
      <g fill="var(--glow)">
        <circle class="mote" cx="230" cy="270" r="2" style="animation-delay:0s"/>
        <circle class="mote" cx="370" cy="275" r="2.5" style="animation-delay:1.5s"/>
        <circle class="mote" cx="320" cy="280" r="1.8" style="animation-delay:3s"/>
        <circle class="mote" cx="260" cy="278" r="1.5" style="animation-delay:4.2s"/>
      </g>

      <!-- Dr. Smoot at the edge, leaning in to look -->
      <g class="lean">
        <path d="M120 255 L128 200 Q140 180 155 200 L162 255 Z" fill="#efe6d6"/>     <!-- lab coat -->
        <rect x="128" y="250" width="9" height="12" fill="#1a110c"/>                  <!-- legs -->
        <rect x="146" y="250" width="9" height="12" fill="#1a110c"/>
        <circle cx="146" cy="180" r="15" fill="#e2b48c"/>                              <!-- head -->
        <path d="M131 176 q15 -22 31 -2 q-4 -12 -16 -12 q-12 0 -15 14z" fill="#d8d8d8"/> <!-- wild hair -->
        <circle cx="152" cy="181" r="5" fill="none" stroke="#1a110c" stroke-width="2"/>  <!-- spectacles -->
        <path d="M155 210 Q175 220 190 235" stroke="#efe6d6" stroke-width="8" stroke-linecap="round" fill="none"/> <!-- arm -->
      </g>
    </svg>
  </div>
  <p class="caption" id="caption"></p>

  <p class="about" id="about"></p>

  <section class="items" id="items"></section>

  <section class="picture" id="picture">
    <div class="frame" id="frame"></div>
    <p class="caption" id="picCaption"></p>
  </section>

  <p class="updated" id="updated"></p>
</div>

<script>
  // Fills the page in from your settings at the top. No need to change this.
  var P = MY_PAGE, $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement.style;
  root.setProperty('--bg', P.colorBackground); root.setProperty('--card', P.colorCards);
  root.setProperty('--text', P.colorText);     root.setProperty('--accent', P.colorAccent);
  root.setProperty('--glow', P.colorGlow);
  document.title = P.title;
  $('title').textContent = P.title;
  $('name').textContent = 'by ' + P.name;
  $('tagline').textContent = P.tagline;
  $('caption').textContent = P.sceneCaption;
  $('about').textContent = P.about;
  P.items.forEach(function (it) {
    var c = document.createElement('div'); c.className = 'card';
    var h = document.createElement('h2'); h.textContent = it.heading;
    var p = document.createElement('p');  p.textContent = it.note;
    c.appendChild(h); c.appendChild(p); $('items').appendChild(c);
  });
  if (!P.showPicture) { $('picture').style.display = 'none'; }
  else if (P.pictureFile) {
    var img = document.createElement('img'); img.src = P.pictureFile; img.alt = P.pictureCaption;
    $('frame').className = 'frame has-img'; $('frame').appendChild(img);
    $('picCaption').textContent = P.pictureCaption;
  } else {
    $('frame').textContent = 'Your picture goes here. Put an image in the same folder as this page, then type its name next to pictureFile at the top of the file.';
    $('picCaption').textContent = P.pictureCaption;
  }
  if (P.showLastUpdated) {
    var d = new Date(document.lastModified);
    $('updated').textContent = 'Last updated ' + d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }
</script>
</body>
</html>
